<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoops Dynasty</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- =====================================================================
       COURT — spotlit floor + faint court lines (a wide center-circle arc
       reads as the court seen at a shallow angle). Dark navy arena base
       comes from the <body> gradient in style.css.
       ===================================================================== -->
  <div class="court" aria-hidden="true">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"
         width="100%" height="100%">
      <!-- Center circle low on the floor (wide ellipse = perspective look) -->
      <ellipse class="paint" cx="800" cy="760" rx="230" ry="70" />
      <!-- Half-court line running through it -->
      <line class="paint" x1="360" y1="760" x2="1240" y2="760" />
      <!-- Faint sideline sweeping toward the baseline -->
      <path class="paint" d="M 120 900 L 470 690 M 1480 900 L 1130 690" />
    </svg>
  </div>

  <!-- =====================================================================
       CORNER ACCENTS — red wedge (top-left), steel wedge (bottom-right).
       ===================================================================== -->
  <div class="corner corner-tl" aria-hidden="true"></div>
  <div class="corner corner-br" aria-hidden="true"></div>

  <!-- Edge vignette for the spotlit look -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- =====================================================================
       TITLE STACK — wordmark, trophy, subtitle, menu (all centered).
       ===================================================================== -->
  <main class="stack">

    <!-- Wordmark: HOOPS (white, beveled) over DYNASTY (crimson) -->
    <h1 class="title">
      <span class="line1">Hoops</span>
      <span class="line2">Dynasty</span>
    </h1>

    <!-- Silver trophy -->
    <span class="trophy" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 3h12v2h3v3a4 4 0 0 1-4 4h-.35A6 6 0 0 1 13 15.9V18h3v2H8v-2h3v-2.1A6 6 0 0 1 7.35 12H7a4 4 0 0 1-4-4V5h3V3zm0 4H5v1a2 2 0 0 0 1 1.73V7zm12 0v2.73A2 2 0 0 0 19 8V7h-1z"/>
      </svg>
    </span>

    <!-- Subtitle -->
    <p class="subtitle">Basketball GM Simulator</p>

    <!-- =================================================================
         MENU — five items. NEW CAREER is the filled red primary and is
         always available. LOAD CAREER starts disabled and is enabled by the
         script below once db.js reports at least one saved league.
         Replace the console logs with real navigation as screens are built.
         ================================================================= -->
    <nav class="menu">
      <button class="btn is-highlight" data-action="new-career">New Career</button>
      <button class="btn is-disabled" data-action="load-career" id="loadBtn" disabled>Load Career</button>
      <button class="btn" data-action="options">Options</button>
      <button class="btn" data-action="credits">Credits</button>
      <button class="btn" data-action="exit">Exit</button>
    </nav>
  </main>

  <!-- =====================================================================
       BEHAVIOR — static & GitHub-Pages friendly (client-side only).
       Uses the repo's IndexedDB layer (db.js): LOAD CAREER unlocks when a
       saved league exists. Wrapped in try/catch so the screen still works
       when storage is unavailable (e.g. file:// URLs). Serve over http(s)
       — Pages or a local server — to exercise the unlock.
       ===================================================================== -->
  <script type="module">
    let listSaves = async () => [];
    try {
      ({ listSaves } = await import('./db.js'));
    } catch (err) {
      console.warn('Storage layer unavailable; Load Career stays disabled.', err);
    }

    // Enable LOAD CAREER only when at least one league is saved.
    async function refreshLoadState() {
      const btn = document.getElementById('loadBtn');
      try {
        const saves = await listSaves();
        if (Array.isArray(saves) && saves.length > 0) {
          btn.classList.remove('is-disabled');
          btn.disabled = false;
        }
      } catch (err) {
        console.warn('Could not check saved leagues:', err);
      }
    }

    // Route menu clicks. Swap the logs for real navigation, e.g.
    // location.href = './game.html?mode=new'.
    document.querySelector('.menu').addEventListener('click', (e) => {
      const btn = e.target.closest('.btn');
      if (!btn || btn.disabled) return;
      const action = btn.dataset.action;
      if (action === 'exit') {
        // Browsers only allow closing script-opened windows; otherwise this
        // is a no-op. Left here so the menu is complete.
        window.close();
        return;
      }
      console.log('→ menu action:', action);
    });

    refreshLoadState();
  </script>
</body>
</html>
