<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060E1F">
  <meta name="description" content="Hoops Dynasty — build a legacy, one season at a time.">
  <title>Hoops Dynasty</title>

  <!-- Fonts: Bebas Neue (HOOPS), Cinzel (DYNASTY), Inter (all UI text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="title.js" defer></script>
</head>
<body>

  <!-- ===== Background: gradient, court, spotlight, dust, vignette ===== -->
  <div class="backdrop" aria-hidden="true">
    <div class="court-wrap">
      <!-- Half-and-half basketball court, drawn as thin lines (real court proportions: 94 x 50 ft) -->
      <svg class="court" viewBox="-20 -20 980 540" xmlns="http://www.w3.org/2000/svg">
        <g class="court-lines">
          <!-- Boundary and half-court line -->
          <rect x="0" y="0" width="940" height="500"/>
          <path d="M470 0V500"/>
          <!-- Center circles -->
          <circle cx="470" cy="250" r="60"/>
          <circle cx="470" cy="250" r="20"/>

          <!-- Left end: key, free-throw circle, three-point line, hoop -->
          <rect x="0" y="170" width="190" height="160"/>
          <path d="M190 190A60 60 0 0 1 190 310"/>
          <path class="dashed" d="M190 190A60 60 0 0 0 190 310"/>
          <path d="M0 30H140A237.5 237.5 0 0 1 140 470H0"/>
          <path d="M40 220V280"/>
          <circle cx="52.5" cy="250" r="7.5"/>
          <path d="M52.5 210A40 40 0 0 1 52.5 290"/>

          <!-- Right end (mirrored) -->
          <rect x="750" y="170" width="190" height="160"/>
          <path d="M750 190A60 60 0 0 0 750 310"/>
          <path class="dashed" d="M750 190A60 60 0 0 1 750 310"/>
          <path d="M940 30H800A237.5 237.5 0 0 0 800 470H940"/>
          <path d="M900 220V280"/>
          <circle cx="887.5" cy="250" r="7.5"/>
          <path d="M887.5 210A40 40 0 0 0 887.5 290"/>
        </g>
      </svg>
    </div>
    <div class="spotlight-cone"></div>
    <div class="particles" id="particles"></div>
    <div class="vignette"></div>
  </div>

  <div class="stage">
    <main class="main">

      <!-- ===== Brand: emblem, wordmark, tagline ===== -->
      <header class="brand">
        <!-- Emblem: crown over a shield holding a basketball -->
        <svg class="emblem" viewBox="0 0 120 136" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hoops Dynasty crest">
          <defs>
            <linearGradient id="emblem-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#F5D76E"/>
              <stop offset="0.45" stop-color="#D4AF37"/>
              <stop offset="1" stop-color="#9C7A1E"/>
            </linearGradient>
            <linearGradient id="emblem-navy" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#13284D"/>
              <stop offset="1" stop-color="#0B1A33"/>
            </linearGradient>
          </defs>

          <!-- Shield -->
          <path d="M60 32L102 42V76C102 102 84 120 60 130C36 120 18 102 18 76V42Z"
                fill="url(#emblem-navy)" stroke="url(#emblem-gold)" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M60 40L95 48V76C95 97 80 112 60 121C40 112 25 97 25 76V48Z"
                fill="none" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1"/>

          <!-- Basketball -->
          <circle cx="60" cy="82" r="24" fill="url(#emblem-gold)"/>
          <g fill="none" stroke="#0B1A33" stroke-width="2" stroke-linecap="round">
            <path d="M60 58V106"/>
            <path d="M36 82H84"/>
            <path d="M42 66Q54 82 42 98"/>
            <path d="M78 66Q66 82 78 98"/>
          </g>

          <!-- Crown -->
          <path d="M40 26L43 9L52 18L60 6L68 18L77 9L80 26Z" fill="url(#emblem-gold)" stroke-linejoin="round"/>
          <rect x="40" y="26" width="40" height="5" rx="1.5" fill="url(#emblem-gold)"/>
          <circle cx="43" cy="8" r="2.2" fill="#F5D76E"/>
          <circle cx="60" cy="5" r="2.2" fill="#F5D76E"/>
          <circle cx="77" cy="8" r="2.2" fill="#F5D76E"/>
        </svg>

        <h1 class="logo" aria-label="Hoops Dynasty">
          <span class="logo-hoops" data-text="HOOPS" aria-hidden="true">HOOPS</span>
          <span class="logo-dynasty" aria-hidden="true">DYNASTY</span>
        </h1>

        <p class="tagline">Build a Legacy. One Season at a Time.</p>
      </header>

      <!-- ===== Main menu =====
           Each button's data-action is looked up in the ACTIONS map in title.js -->
      <nav class="menu-card" aria-label="Main menu">
        <div class="menu" id="menu" role="group">

          <!-- Only shown when a save exists in localStorage (see title.js) -->
          <button class="menu-btn" id="continue-btn" data-action="continue" type="button" hidden>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5L15.5 12L10 15.5Z"/></svg>
            <span>
              <span class="label">Continue</span>
              <small class="sub"></small>
            </span>
          </button>

          <button class="menu-btn menu-btn--primary" data-action="new-dynasty" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8L7.5 12L12 5L16.5 12L21 8L19 19H5Z"/></svg>
            <span class="label">New Dynasty</span>
          </button>

          <button class="menu-btn" data-action="load-dynasty" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4V15"/><path d="M7.5 10.5L12 15L16.5 10.5"/><path d="M5 19H19"/></svg>
            <span class="label">Load Dynasty</span>
          </button>

          <button class="menu-btn" data-action="quick-game" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 13.5H11L10 21L18 10.5H12Z"/></svg>
            <span class="label">Quick Game</span>
          </button>

          <button class="menu-btn" data-action="settings" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7H13"/><path d="M19 7H20"/><circle cx="16" cy="7" r="2.2"/><path d="M4 17H5"/><path d="M11 17H20"/><circle cx="8" cy="17" r="2.2"/></svg>
            <span class="label">Settings</span>
          </button>

          <button class="menu-btn" data-action="how-to-play" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.6A2.5 2.5 0 1 1 13 12C12.3 12.4 12 12.9 12 13.7"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
            <span class="label">How to Play</span>
          </button>

        </div>
      </nav>
    </main>

    <!-- ===== Bottom: news ticker + footer ===== -->
    <footer class="bottom">
      <section class="ticker" aria-label="League news">
        <div class="ticker-label"><span class="live-dot" aria-hidden="true"></span>LEAGUE NEWS</div>
        <div class="ticker-viewport" id="ticker-viewport">
          <!-- Headlines are rendered by title.js from the HEADLINES array -->
          <div class="ticker-track" id="ticker-track"></div>
        </div>
      </section>
      <div class="meta">
        <span>v0.2.0</span>
        <span>© 2026 Hoops Dynasty</span>
      </div>
    </footer>
  </div>

  <!-- Toast notifications appear here (announced to screen readers) -->
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

</body>
</html>
