<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoops Dynasty</title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- =====================================================================
       ARENA RINGS — enormous, barely-there circles bleeding off the left and
       right edges, plus one behind the wordmark. Pure CSS (see .rings), they
       give the black field some depth without reading as decoration.
       ===================================================================== -->
  <div class="rings" aria-hidden="true"></div>

  <!-- =====================================================================
       FLOOR — dark hardwood along the bottom, seen at a shallow angle:
       plank grain + a warm gradient, with court paint drawn on top. The
       centre circle sits half off the bottom edge; the sidelines converge
       toward the far baseline so the boards read as receding.
       ===================================================================== -->
  <div class="floor" aria-hidden="true">
    <svg viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice"
         width="100%" height="100%">
      <!-- far baseline -->
      <line class="paint" x1="0" y1="104" x2="1600" y2="104" />
      <!-- sidelines receding toward it -->
      <path class="paint" d="M -80 430 L 470 112 M 1680 430 L 1130 112" />
      <!-- three-point arc -->
      <path class="paint" d="M 300 430 Q 800 214 1300 430" />
      <!-- centre circle, half below the screen edge -->
      <ellipse class="paint" cx="800" cy="452" rx="300" ry="92" />
    </svg>
  </div>

  <!-- Edge vignette — darkens the corners so the middle reads as lit. -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- =====================================================================
       TITLE STACK — crest, wordmark, subtitle, menu (all centered).
       ===================================================================== -->
  <main class="stack">

    <!-- Basketball crest between two thin rules. -->
    <div class="crest" aria-hidden="true">
      <span class="rule left"></span>
      <span class="ball">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
             stroke-width="4.5" stroke-linecap="round">
          <circle cx="50" cy="50" r="45" />
          <path d="M50 5 V95 M5 50 H95" />
          <path d="M17 15 C37 34 37 66 17 85" />
          <path d="M83 15 C63 34 63 66 83 85" />
        </svg>
      </span>
      <span class="rule right"></span>
    </div>

    <!-- Wordmark: HOOPS (white) over DYNASTY (orange) -->
    <h1 class="title">
      <span class="line1">Hoops</span>
      <span class="line2">Dynasty</span>
    </h1>

    <!-- Subtitle -->
    <p class="subtitle">Basketball GM Simulator</p>

    <!-- =================================================================
         MENU — three items in one compact block. NEW CAREER is the filled
         orange primary and is always available. LOAD CAREER and CONTINUE
         start disabled and are enabled by the script below once db.js
         reports at least one saved league (Continue also carries a small
         lock glyph until then).
         ================================================================= -->
    <nav class="menu">
      <button class="btn is-highlight" data-action="new-career">New Career</button>
      <button class="btn is-disabled" data-action="load-career" id="loadBtn" disabled>Load Career</button>
      <button class="btn is-disabled" data-action="continue" id="continueBtn" disabled>
        Continue <span class="lock" aria-hidden="true">🔒</span>
      </button>
    </nav>
  </main>

  <!-- =====================================================================
       BEHAVIOR — static & GitHub-Pages friendly (client-side only).
       Uses the repo's IndexedDB layer (db.js): LOAD CAREER and CONTINUE
       unlock once a saved league exists. Wrapped in try/catch so the screen
       still works when storage is unavailable (e.g. file:// URLs). Serve over
       http(s) — Pages or a local server — to exercise the unlock.
       ===================================================================== -->
  <script type="module">
    let listSaves = async () => [];
    let listSavesDetailed = async () => [];
    try {
      ({ listSaves, listSavesDetailed } = await import('./db.js'));
    } catch (err) {
      console.warn('Storage layer unavailable; Load Career and Continue stay locked.', err);
    }

    // Enable a disabled button and drop any lock glyph it carries.
    function unlock(id) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.classList.remove('is-disabled');
      btn.disabled = false;
      const lock = btn.querySelector('.lock');
      if (lock) lock.remove();
    }

    // LOAD CAREER and CONTINUE both require at least one saved league.
    async function refreshSaveState() {
      try {
        const saves = await listSaves();
        if (Array.isArray(saves) && saves.length > 0) {
          unlock('loadBtn');
          unlock('continueBtn');
        }
      } catch (err) {
        console.warn('Could not check saved leagues:', err);
      }
    }

    // Route menu clicks. New Career -> setup. Load Career -> save browser.
    // Continue -> jump straight into the most-recently-played save's dashboard.
    document.querySelector('.menu').addEventListener('click', async (e) => {
      const btn = e.target.closest('.btn');
      if (!btn || btn.disabled) return;
      const action = btn.dataset.action;
      if (action === 'new-career') { location.href = './new-career.html'; return; }
      if (action === 'load-career') { location.href = './load-career.html'; return; }
      if (action === 'continue') {
        try {
          const list = await listSavesDetailed();
          if (list.length) { location.href = './gm-dashboard.html?id=' + encodeURIComponent(list[0].id); return; }
        } catch (_) {}
        location.href = './load-career.html';
        return;
      }
      console.log('→ menu action:', action);
    });

    refreshSaveState();
  </script>
</body>
</html>
