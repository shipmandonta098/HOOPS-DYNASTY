<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoops Dynasty — Playoffs</title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./gm-dashboard.css" />
  <link rel="stylesheet" href="./roster.css" />
  <link rel="stylesheet" href="./playoffs.css" />
</head>
<body>

  <div class="arena-rings" aria-hidden="true"></div>
  <div class="app">

    <aside class="sidebar">
      <a class="brand" href="./index.html" style="text-decoration:none;display:block">
        <span class="h">Hoops</span><span class="d">Dynasty</span>
        <span class="sub">Basketball GM Simulator</span>
        <span class="tr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v2h3v3a4 4 0 0 1-4 4h-.35A6 6 0 0 1 13 15.9V18h3v2H8v-2h3v-2.1A6 6 0 0 1 7.35 12H7a4 4 0 0 1-4-4V5h3V3zm0 4H5v1a2 2 0 0 0 1 1.73V7zm12 0v2.73A2 2 0 0 0 19 8V7h-1z"/></svg></span>
      </a>
      <nav class="nav"><!-- shell.js --></nav>
    </aside>

    <main class="main">

      <div class="topbar roster-top">
        <div class="rt-left">
          <h1>Playoffs</h1>
          <div class="tabs" id="tabs">
            <button class="tab is-active" data-tab="bracket">Bracket</button>
            <button class="tab" data-tab="picture">Playoff Picture</button>
            <button class="tab" data-tab="compare">Team Comparison</button>
            <button class="tab" data-tab="history">History</button>
          </div>
        </div>
        <div class="po-when">
          <span id="poLeague">—</span><i>|</i><span id="poSeason">—</span>
          <i>|</i><span id="poState">—</span>
        </div>
      </div>

      <!-- Says which of the two things the bracket currently is: a projection
           from today's standings, or the real one. -->
      <div class="po-banner" id="poBanner"></div>

      <div id="paneBracket"><!-- playoffsView.js --></div>
      <div id="panePicture" hidden><!-- playoffsView.js --></div>
      <div id="paneCompare" hidden><!-- playoffsView.js --></div>
      <div id="paneHistory" hidden><!-- playoffsView.js --></div>

      <div id="noCareer" hidden></div>
    </main>
  </div>

  <script type="module" src="./playoffsView.js"></script>
</body>
</html>
