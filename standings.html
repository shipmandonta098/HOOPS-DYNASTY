<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoops Dynasty — Standings</title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./gm-dashboard.css" />
  <link rel="stylesheet" href="./roster.css" />
  <link rel="stylesheet" href="./standings.css" />
</head>
<body>

  <div class="arena-rings" aria-hidden="true"></div>
  <div class="app">

    <aside class="sidebar">
      <a class="brand" href="./index.html" style="text-decoration:none;display:block">
        <span class="h">Hoops</span><span class="d">Dynasty</span>
        <span class="sub">Basketball GM Simulator</span>
        <span class="tr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v2h3v3a4 4 0 0 1-4 4h-.35A6 6 0 0 1 13 15.9V18h3v2H8v-2h3v-2.1A6 6 0 0 1 7.35 12H7a4 4 0 0 1-4-4V5h3V3zm0 4H5v1a2 2 0 0 0 1 1.73V7zm12 0v2.73A2 2 0 0 0 19 8V7h-1z"/></svg></span>
      </a>
      <nav class="nav"><!-- shell.js --></nav>
    </aside>

    <main class="main">

      <div class="topbar roster-top">
        <div class="rt-left">
          <!-- The reference puts a real-world league mark beside the title.
               This carries the league's OWN badge instead: the game uses no
               real-world branding, and the save has an identity of its own. -->
          <div class="st-title">
            <span class="st-badge" id="leagueBadge">—</span>
            <h1>Standings</h1>
          </div>
          <div class="tabs" id="scopeTabs">
            <button class="tab" data-scope="league">League</button>
            <button class="tab is-active" data-scope="conference">Conference</button>
            <button class="tab" data-scope="division">Division</button>
          </div>
        </div>
        <div class="st-controls">
          <div class="st-season">
            <label class="sr-only" for="seasonSel">Season</label>
            <span class="st-sk">Season</span>
            <select id="seasonSel"><!-- standingsView.js --></select>
          </div>
          <div class="stepper st-phase">
            <button id="phasePrev" aria-label="Previous phase" disabled>‹</button>
            <span id="phaseLabel">Regular Season</span>
            <button id="phaseNext" aria-label="Next phase" disabled>›</button>
          </div>
        </div>
      </div>

      <!-- What the colour rail down the left of each table means. -->
      <div class="st-legend" id="legend"><!-- standingsView.js --></div>

      <!-- Said once, above the tables, in a league that has not played yet. -->
      <div class="st-empty" id="emptyNote" hidden></div>

      <div id="groups"><!-- standingsView.js --></div>

      <div id="noCareer" hidden></div>
    </main>
  </div>

  <script type="module" src="./standingsView.js"></script>
</body>
</html>
